name: Validar site bilíngue sem publicar

on:
  push:
    branches:
      - feature/site-bilingue-pt-en
      - feature/revisao-blog-pt-en-2026-11-05
      - feature/blog-imagens-historia-metrologia-2026-11-05
      - feature/corrigir-legendas-imagem-egipcia-2026-11-05
      - feature/filtro-blog-home-pt-2026-11-05
      - feature/ajustar-legendas-metrologia-pt-en-2026-11-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilingual-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de testes
        uses: actions/checkout@v6
      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Instalar validador YAML
        run: python -m pip install PyYAML
      - name: Validar conteúdo e rotas existentes
        run: |
          python scripts/validate_site.py
          python scripts/validate_bilingual.py
          python scripts/validate_blog_editorial.py
          python scripts/validate_blog_images.py
      - name: Renderizar site sem deploy
        run: quarto render
      - name: Verificar HTML em português e inglês
        run: |
          python scripts/validate_rendered_carousel.py
          python scripts/validate_rendered_bilingual.py
      - name: Gerar pacote HTML para prévia, sem publicação
        uses: actions/upload-artifact@v4
        with:
          name: preview-site-pt-en
          path: _site/
          if-no-files-found: error
          retention-days: 14
