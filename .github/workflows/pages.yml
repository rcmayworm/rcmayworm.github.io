name: Publicar site Quarto no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter os arquivos
        uses: actions/checkout@v6
      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Validar arquivos do site
        run: |
          python -m pip install PyYAML
          python scripts/validate_site.py
      - name: Renderizar site
        run: quarto render
      - name: Validar carrossel do blog no HTML renderizado
        run: python scripts/validate_rendered_carousel.py
      - name: Renderizar livro Quarto Book
        run: |
          quarto render livro-analise-certificados --to html
          test -f livro-analise-certificados/_book/index.html
          mkdir -p _site/livro-analise-certificados
          cp -a livro-analise-certificados/_book/. _site/livro-analise-certificados/
          test -f _site/livro-analise-certificados/index.html
      - name: Renderizar prévia do modelo de apresentações
        run: |
          (cd apresentacoes/modelo-v01 && quarto render template.qmd --to revealjs)
          test -f apresentacoes/modelo-v01/template.html
          grep -q 'class="reveal"' apresentacoes/modelo-v01/template.html
          mkdir -p _site/previas/modelo-apresentacoes-v01
          cp apresentacoes/modelo-v01/template.html _site/previas/modelo-apresentacoes-v01/index.html
          test -f _site/previas/modelo-apresentacoes-v01/index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site renderizado
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
