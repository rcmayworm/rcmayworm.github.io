name: Recuperar imagem egípcia original (validação sem publicar)
on:
  push:
    branches:
      - feature/corrigir-legendas-imagem-egipcia-2026-11-05
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Baixar a imagem com verificações
        shell: bash
        run: |
          set -eu
          mkdir -p recovered
          python - <<'PY'
          from urllib.request import Request, urlopen
          from PIL import Image, UnidentifiedImageError
          from io import BytesIO
          urls = [
            "https://asmetro.org.br/portalsn/wp-content/uploads/2025/02/1738087115334.jpeg",
            "https://i0.wp.com/asmetro.org.br/portalsn/wp-content/uploads/2025/02/1738087115334.jpeg?resize=696%2C392&ssl=1",
            "https://i0.wp.com/asmetro.org.br/portalsn/wp-content/uploads/2025/02/1738087115334.jpeg?ssl=1",
            "https://asmetro.org.br/portalsn/wp-content/uploads/2025/02/1738087115334-696x392.jpeg",
            "https://asmetro.org.br/portalsn/wp-content/uploads/2025/02/1738087115334-300x169.jpeg",
            "https://upload.wikimedia.org/wikipedia/commons/e/e0/Egypt.Papyrus.01c.jpg",
          ]
          ok = False
          for url in urls:
              try:
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; academic-site-image-check/1.0)"})
                  with urlopen(req, timeout=17) as r:
                      body = r.read(6_000_000)
                      status = r.status
                  img = Image.open(BytesIO(body))
                  img.verify()
                  img = Image.open(BytesIO(body))
                  print(f"SUCCESS {url} status={status} mode={img.mode} size={img.size} bytes={len(body)}")
                  if min(img.size) < 250:
                      raise ValueError("resolution too low")
                  img.convert("RGB").save("recovered/papiro-egipcio.avif", "AVIF", quality=28, speed=6)
                  open("recovered/source.txt","w").write(url + "\n")
                  ok=True
                  break
              except Exception as e:
                  print("FAILED",url,type(e).__name__,str(e)[:240])
          if not ok:
              print("Image unavailable at all known source URLs")
          PY
      - name: Versionar imagem na branch de revisão
        shell: bash
        run: |
          set -eu
          test -s recovered/papiro-egipcio.avif
          target="blog/posts/a-fascinante-jornada-da-metrologia/images/papiro-egipcio.avif"
          mkdir -p "$(dirname "$target")"
          cp recovered/papiro-egipcio.avif "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "assets(blog): adicionar papiro egípcio local licenciado"
            git push origin HEAD:feature/corrigir-legendas-imagem-egipcia-2026-11-05
          fi
      - name: Enviar arquivo recuperado para revisão
        uses: actions/upload-artifact@v4
        with:
          name: papiro-egipcio-original
          path: recovered/
          if-no-files-found: error
          retention-days: 3
