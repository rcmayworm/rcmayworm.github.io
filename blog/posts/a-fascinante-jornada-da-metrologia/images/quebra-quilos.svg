<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Linha do tempo da adoção do sistema métrico no Brasil e da Revolta dos Quebra-Quilos"><title>Linha do tempo da adoção do sistema métrico no Brasil e da Revolta dos Quebra-Quilos</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081e30"/><stop offset="1" stop-color="#16546b"/></linearGradient><linearGradient id="b" x2="0" y2="1"><stop stop-color="#6acfe8"/><stop offset="1" stop-color="#207a9a"/></linearGradient></defs><rect width="900" height="330" fill="url(#bg)"/><text x="50" y="60" font-family="Arial,sans-serif" font-size="30" fill="#f2f9fc" font-weight="700">Adoção do sistema métrico no Brasil</text><path d="M110 172 H790" stroke="#79bfd0" stroke-width="4"/><g><circle cx="160" cy="172" r="12" fill="#3bb4cf" stroke="white" stroke-width="3"/><text x="160" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="29" fill="#f2f9fc">1862</text><text x="160" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#b9d3dd">Lei imperial</text></g><g><circle cx="455" cy="172" r="12" fill="#3bb4cf" stroke="white" stroke-width="3"/><text x="455" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="29" fill="#f2f9fc">1874–1875</text><text x="455" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#b9d3dd">Quebra-Quilos</text></g><g><circle cx="750" cy="172" r="12" fill="#3bb4cf" stroke="white" stroke-width="3"/><text x="750" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="29" fill="#f2f9fc">1875</text><text x="750" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#b9d3dd">Convenção do Metro</text></g><text x="50" y="292" font-family="Arial,sans-serif" font-size="17" fill="#aed2de">Infográfico cronológico autoral; não reproduz documento histórico.</text></svg>