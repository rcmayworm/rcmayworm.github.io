<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Representação de três constantes físicas associadas às definições modernas do segundo, metro e quilograma"><title>Representação de três constantes físicas associadas às definições modernas do segundo, metro e quilograma</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081e30"/><stop offset="1" stop-color="#16546b"/></linearGradient><linearGradient id="b" x2="0" y2="1"><stop stop-color="#6acfe8"/><stop offset="1" stop-color="#207a9a"/></linearGradient></defs><rect width="900" height="360" fill="url(#bg)"/><text x="48" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f2f9fc">Measurements and physical constants</text><g><rect x="48" y="107" width="252" height="132" rx="15" fill="#174a61" stroke="#69c4d8" stroke-opacity=".65"/><text x="70" y="150" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#f2f9fc">Second</text><text x="70" y="195" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#b9d3dd">Caesium frequency</text></g><g><rect x="324" y="107" width="252" height="132" rx="15" fill="#174a61" stroke="#69c4d8" stroke-opacity=".65"/><text x="346" y="150" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#f2f9fc">Metre</text><text x="346" y="195" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#b9d3dd">Speed of light</text></g><g><rect x="600" y="107" width="252" height="132" rx="15" fill="#174a61" stroke="#69c4d8" stroke-opacity=".65"/><text x="622" y="150" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#f2f9fc">Kilogram</text><text x="622" y="195" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#b9d3dd">Planck constant</text></g><text x="450" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#b9d3dd">International System of Units (SI) · conceptual diagram</text></svg>